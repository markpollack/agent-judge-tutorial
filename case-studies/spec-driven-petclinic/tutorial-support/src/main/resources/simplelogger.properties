# Make the log readable on a projector.
#
# slf4j-simple prints the fully qualified class name by default, so every line begins with
# 55 characters of package before anything you care about. The short name is the useful part:
# read down the left edge and you get the pipeline -- JudgeBackends, EarsCriterion,
# RecordedJudgeModel, EarsJudge -- which is the flow, for free.
org.slf4j.simpleLogger.showShortLogName=true
org.slf4j.simpleLogger.showThreadName=false
org.slf4j.simpleLogger.levelInBrackets=true
